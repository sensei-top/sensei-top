appId: top.sensei.app
productName: Sensei Top
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - assets/**
  - "!dist/**/*.test.*"
  - "!dist/notices/**"
  - package.json
npmRebuild: false
# Placeholder feed, like installer.nsh's URLs: plan 9 phase 1 puts the releases
# on the public repository, and `latest/download` serves the newest release's
# latest.yml. Until then a check fails with a 404, which the shell logs.
publish:
  provider: generic
  url: https://github.com/sensei-top/sensei-top/releases/latest/download
extraResources:
  - from: server/dist/sensei-top
    to: server
  - from: ../LICENSE
    to: LICENSE
  - from: ../TRADEMARK.md
    to: TRADEMARK.md
  - from: dist/notices/third-party-notices.txt
    to: licenses/desktop-third-party-notices.txt
win:
  icon: build/icon.png
  target: [nsis, appx]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  include: build/installer.nsh
appx:
  # Placeholder identity: plan 9 fills these in from Partner Center.
  identityName: SenseiTop.Placeholder
  publisher: CN=00000000-0000-0000-0000-000000000000
  publisherDisplayName: Sensei Top
  applicationId: SenseiTop
linux:
  icon: build/icon.png
  target: [AppImage]
  category: Game
  executableName: sensei-top
  syncDesktopName: true
