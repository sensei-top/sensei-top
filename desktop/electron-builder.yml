appId: top.sensei.app
productName: Sensei Top
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - assets/**
  - "!dist/**/*.test.*"
  - "!dist/notices/**"
  - package.json
npmRebuild: false
# The feed is the public repository's releases, tagged `vX.Y.Z` (the first,
# v0.7.0, on 2026-10-12; plan 9). The github provider, not a generic `latest/download`
# URL: differential download fetches the installed version's blockmap from that
# version's own release, which `latest/download` cannot serve.
publish:
  provider: github
  owner: sensei-top
  repo: sensei-top
extraResources:
  - from: server/dist/sensei-top
    to: server
  - from: ../LICENSE
    to: LICENSE
  - from: ../TRADEMARK.md
    to: TRADEMARK.md
  - from: dist/notices/third-party-notices.txt
    to: licenses/desktop-third-party-notices.txt
win:
  icon: build/icon.png
  target: [nsis, appx]
nsis:
  artifactName: Sensei-Top-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  include: build/installer.nsh
  installerLanguages: [en_US, pt_BR]
  multiLanguageInstaller: true
  displayLanguageSelector: true
appx:
  artifactName: Sensei-Top-${version}.${ext}
  identityName: SenseiTop.SenseiTop
  publisher: CN=DD35EA1C-E105-489A-8CDD-D132796EF87B
  publisherDisplayName: Sensei Top
  applicationId: SenseiTop
  languages: [en-US, pt-BR]
  backgroundColor: "#0b0c14"
  # Windows 10 1809, above the desktop StartupTask's minimum (electron-builder's default predates it); also written as MaxVersionTested when none is set.
  minVersion: 10.0.17763.0
  customExtensionsPath: build/appx-extensions.xml
linux:
  icon: build/icon.png
  artifactName: Sensei-Top-${version}.${ext}
  # The tarball writes no update info, so latest-linux.yml keeps naming the AppImage.
  target: [AppImage, tar.gz]
  category: Game
  executableName: sensei-top
  syncDesktopName: true
