[project]
name = "sensei-top"
version = "1.4.1"
description = "Fully local MTG Arena match analytics: log parser, SQLite store, dashboard"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "keyring>=25.7.0",
    "orjson>=3.10",
    "polib>=1.2.0",
    "pydantic>=2.7",
    "sentry-sdk>=2.73.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "import-linter>=2.15",
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sensei-top = "sensei_top.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
preview = true
explicit-preview-rules = true
extend-select = ["PLW1514"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "sensei_top"

[[tool.importlinter.contracts]]
name = "Core never imports sensei_top.ai"
type = "forbidden"
source_modules = [
    "sensei_top.api",
    "sensei_top.archetypes",
    "sensei_top.arena_config",
    "sensei_top.arena_install",
    "sensei_top.backup",
    "sensei_top.card_images",
    "sensei_top.cards",
    "sensei_top.cli",
    "sensei_top.claude_config",
    "sensei_top.clock",
    "sensei_top.config",
    "sensei_top.contrib",
    "sensei_top.db",
    "sensei_top.diagnostics",
    "sensei_top.doctor",
    "sensei_top.formats",
    "sensei_top.guide",
    "sensei_top.i18n",
    "sensei_top.live",
    "sensei_top.logs",
    "sensei_top.metagame",
    "sensei_top.mtgo",
    "sensei_top.procs",
    "sensei_top.projector",
    "sensei_top.reader",
    "sensei_top.review",
    "sensei_top.scrub",
    "sensei_top.secrets",
    "sensei_top.steam",
    "sensei_top.sync",
    "sensei_top.table",
    "sensei_top.telemetry",
    "sensei_top.wine",
]
forbidden_modules = ["sensei_top.ai"]
allow_indirect_imports = true
