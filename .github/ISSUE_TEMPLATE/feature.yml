name: A feature
description: Something the tracker should do.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Read the roadmap's "Never" list first (ROADMAP.md): an overlay, live advice in ranked games, reading either client's memory, draft, mobile, telemetry and Arena-only formats are decisions, not gaps. For an idea you want to talk over before it is a request, Discussions is the place.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation at the table or on the ladder, not the button you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: today
    attributes:
      label: How do you manage it today?
