name: CI

# Two repositories hold this file. The private one runs pull requests and
# hand runs only, because its minutes are metered. The public one,
# sensei-top/sensei-top, also runs every push to develop and main, where
# minutes are unmetered; each job's `if:` keeps push jobs off the private one
# (docs/testing.md, "CI").
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Every uv run, including the one pnpm gen:types makes, refuses to rewrite uv.lock.
env:
  UV_LOCKED: "1"

jobs:
  linux:
    if: github.event_name != 'push' || github.repository == 'sensei-top/sensei-top'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags, so it's pinned exactly.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm test
        working-directory: web
      # Writes src/sensei_top/web_dist/ (gitignored), not web/dist/.
      - run: pnpm build
        working-directory: web
      # The generated API types must match what the API now says.
      - run: pnpm gen:types
        working-directory: web
      - run: git diff --exit-code

  windows:
    if: github.event_name != 'push' || github.repository == 'sensei-top/sensei-top'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
